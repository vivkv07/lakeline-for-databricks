<!--
  Fixture fragment: Databricks Apps list (route /apps). Synthetic data only (workspace
  1234567890). Apps are identified by their route name (/apps/<name>), matching
  usage_metadata.app_name. The external app URL, "Create app" and settings links are ignored.

  has no usage on purpose.
-->
<style data-fixture="apps">
  .fx-apps { font: 13px/1.4 system-ui, sans-serif; color: #11171c; padding: 0 16px; }
  .fx-apps table { width: 100%; border-collapse: collapse; }

  .fx-apps a { color: #2272b4; text-decoration: none; }
</style>

    <a href="/apps/create?o=1234567890">Create app</a>

    <thead>
      <tr><th scope="col">Name</th><th scope="col">URL</th><th scope="col">Status</th><th scope="col"></th></tr>
