<!--
  Fixture fragment: a synthetic imitation of the native workspace top bar that the workspace
  color feature targets (nav[aria-label="Top Navigation"]). Synthetic data only; no vendor
  assets. Native-like controls set their own explicit colors, as the real design system does,
  so the theme's foreground and field rules are exercised. The page header inside <main> is a
  second header that must never be tinted.
-->
<style data-fixture="topbar">
  .fx-topnav { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; background: #ffffff; border-bottom: 1px solid #e0e4e8; font: 13px/1.4 system-ui, sans-serif; }
  .fx-icon-btn, .fx-switcher { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #5f7281; font: inherit; cursor: pointer; }
  .fx-icon-btn:hover, .fx-switcher:hover { background: rgba(34, 114, 180, 0.08); }
  .fx-home { display: inline-flex; align-items: center; gap: 6px; color: #11171c; text-decoration: none; font-weight: 600; }
  .fx-search { flex: 1 1 auto; display: flex; justify-content: center; }
  .fx-field { display: inline-flex; align-items: center; gap: 6px; width: min(520px, 100%); height: 32px; padding: 0 8px; border: 1px solid #d1d9e1; border-radius: 4px; background: #f7f7f7; color: #5f7281; }
  .fx-field input { flex: 1 1 auto; border: 0; background: transparent; color: #11171c; font: inherit; }
  .fx-kbd { font-size: 11px; color: #5f7281; border: 1px solid #d1d9e1; border-radius: 3px; padding: 0 4px; }
  .fx-avatar { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border: 0; border-radius: 50%; background: #2272b4; color: #ffffff; font: 600 12px system-ui, sans-serif; }
  .fx-page-header { display: flex; align-items: center; height: 40px; padding: 0 16px; background: #f7f7f7; border-bottom: 1px solid #e0e4e8; }
</style>
<nav aria-label="Top Navigation" class="fx-topnav" data-testid="fx-topnav">
  <button type="button" class="fx-icon-btn" aria-label="Toggle sidebar">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 3.5h12V5H2zm0 3.75h12v1.5H2zM2 11h12v1.5H2z"/></svg>
  </button>
  <a href="/?o=1234567890" class="fx-home" aria-label="Workspace home">
    <svg class="fx-brand" data-fx="brand-graphic" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path fill="#E8590C" d="M10 1 19 6 10 11 1 6z"/><path fill="#1F2933" d="M1 9.5 10 14.5 19 9.5V12L10 17 1 12z"/></svg>
    <span class="fx-wordmark">Fixture Workspace</span>
  </a>
  <div role="search" class="fx-search">
    <span class="fx-field du-bois-light-input-affix-wrapper">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M7 2a5 5 0 0 1 3.9 8.1l3 3-1 1-3-3A5 5 0 1 1 7 2zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg>
      <input type="search" placeholder="Search data, notebooks, recents, and more" aria-label="Search">
      <span class="fx-kbd">Ctrl P</span>
    </span>
  </div>
  <button type="button" class="fx-switcher" aria-haspopup="menu" aria-label="Switch workspace">
    fixture-workspace
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
  </button>
  <button type="button" class="fx-icon-btn" aria-label="Help">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0-7a3 3 0 0 0-3 3h1.5A1.5 1.5 0 1 1 8 8.5h-.75V10h1.5v-.08A3 3 0 0 0 8 4z"/></svg>
  </button>
  <button type="button" class="fx-avatar" aria-label="Account: Test User">TU</button>
</nav>
<main data-testid="main-content">
  <header class="fx-page-header"><h1>Jobs</h1></header>
  <p>Synthetic workspace page body.</p>
</main>
