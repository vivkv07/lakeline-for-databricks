<!--
  Fixture fragment: a synthetic imitation of the native workspace chrome that the workspace
  color feature targets: the top bar (nav[aria-label="Top Navigation"]), the side navigation
  (nav[aria-label="Side Navigation"]) and the shell around the page card. Synthetic data only;
  no vendor assets. Native-like controls set their own explicit colors, as the real design
  system does: the search is a combobox around a painted affix wrapper, "Verify identity" is a
  translucent pill, and the account initials sit on a colored circle with no "avatar" class. The
  page header inside <main> is a second header that must never be tinted.
  The fixture SPA (local/workspace.js) only takes the top bar from this file.
-->
<style data-fixture="topbar">
  .fx-topnav { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; background: #f6f7f9; font: 13px/1.4 system-ui, sans-serif; }
  .fx-icon-btn, .fx-switcher { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; color: #5f7281; font: inherit; cursor: pointer; }
  .fx-icon-btn:hover, .fx-switcher:hover { background: rgba(34, 114, 180, 0.08); }
  .fx-home { display: inline-flex; align-items: center; gap: 6px; color: #11171c; text-decoration: none; font-weight: 600; }
  .fx-search { flex: 1 1 auto; display: flex; justify-content: center; }
  .fx-combo { width: min(520px, 100%); }
  .fx-field { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 8px; border: 1px solid #d1d9e1; border-radius: 4px; background: #ffffff; color: #5f7281; }
  .fx-field input { flex: 1 1 auto; border: 0; background: transparent; color: #11171c; font: inherit; }
  .fx-kbd { font-size: 11px; color: #5f7281; }
  .fx-menu { margin: 0; padding: 0; list-style: none; background: #ffffff; }
  .fx-pill { min-height: 24px; padding: 0 8px; border: 1px solid rgba(34, 114, 180, 0.08); border-radius: 16px; background: rgba(34, 114, 180, 0.08); color: #0e538b; font: inherit; }
  .fx-initials { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 100%; background: #a6630c; color: #ffffff; font: 600 11px system-ui, sans-serif; }
  .fx-shell { display: flex; background: #f6f7f9; }
  .fx-sidenav { flex: none; width: 200px; padding: 0 12px; background: #f6f7f9; font: 13px/1.4 system-ui, sans-serif; }
  .fx-new { width: 100%; min-height: 40px; border: 1px solid rgba(255, 73, 73, 0.08); border-radius: 8px; background: rgba(255, 73, 73, 0.08); color: #11171c; font: inherit; font-weight: 600; }
  .fx-side-link { display: block; padding: 4px 12px; border-radius: 4px; color: #11171c; text-decoration: none; }
  .fx-side-link[aria-current="true"] { background: rgba(34, 114, 180, 0.08); color: #0e538b; }
  .fx-side-section { display: block; padding: 12px 12px 4px; color: #5f7281; font-size: 11px; }
  .fx-card { flex: 1 1 auto; border: 1px solid #f6f7f9; border-radius: 8px; background: #ffffff; }
  .fx-page-header { display: flex; align-items: center; height: 40px; padding: 0 16px; background: #f7f7f7; border-bottom: 1px solid #e0e4e8; }
</style>
<nav aria-label="Top Navigation" class="fx-topnav" data-testid="fx-topnav">
  <button type="button" class="fx-icon-btn" aria-label="Toggle navigation">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M2 3.5h12V5H2zm0 3.75h12v1.5H2zM2 11h12v1.5H2z"/></svg>
  </button>
  <a href="/?o=1234567890" class="fx-home" aria-label="Workspace home">
    <svg class="fx-brand" data-fx="brand-graphic" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path fill="#E8590C" d="M4 2h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path fill="#1F2933" d="M12 10h4a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2z"/></svg>
    <span class="fx-wordmark">Fixture Workspace</span>
  </a>
  <div class="fx-search">
    <div role="combobox" aria-label="Search" aria-expanded="false" class="fx-combo">
      <span class="fx-field du-bois-light-input-affix-wrapper">
        <span class="fx-prefix"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M7 2a5 5 0 0 1 3.9 8.1l3 3-1 1-3-3A5 5 0 1 1 7 2zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z"/></svg></span>
        <input type="text" placeholder="Search data, notebooks, recents, and more" aria-label="Search">
        <span class="fx-kbd">Ctrl P</span>
      </span>
      <ul role="listbox" class="fx-menu"></ul>
    </div>
  </div>
  <button type="button" class="fx-pill">Verify identity</button>
  <button type="button" class="fx-switcher" aria-haspopup="menu" aria-label="Switch workspace">
    fixture-workspace
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M4 6l4 4 4-4z"/></svg>
  </button>
  <button type="button" class="fx-icon-btn" aria-label="Help">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 10a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm0-7a3 3 0 0 0-3 3h1.5A1.5 1.5 0 1 1 8 8.5h-.75V10h1.5v-.08A3 3 0 0 0 8 4z"/></svg>
  </button>
  <button type="button" class="fx-icon-btn" data-testid="user-menu-trigger" aria-label="Account: Test User">
    <span><div class="fx-initials"><abbr>TU</abbr></div></span>
  </button>
</nav>
<div class="fx-shell" data-testid="fx-shell">
  <nav aria-label="Side Navigation" data-testid="UnifiedSideNav" class="fx-sidenav">
    <button type="button" class="fx-new" data-testid="NewDropdown">New</button>
    <a href="/?o=1234567890" role="link" aria-current="true" class="fx-side-link" data-fx="side-home">Home</a>
    <a href="/jobs?o=1234567890" role="link" aria-current="false" class="fx-side-link" data-fx="side-jobs">Jobs &amp; Pipelines</a>
    <span class="fx-side-section">SQL</span>
    <a href="/sql/history?o=1234567890" role="link" aria-current="false" class="fx-side-link">Query History</a>
  </nav>
  <div class="fx-card" data-testid="fx-card">
    <main data-testid="main-content">
      <header class="fx-page-header"><h1>Jobs</h1></header>
      <p>Synthetic workspace page body.</p>
    </main>
  </div>
</div>
