<!--

  /sql/warehouses/a1b2c3d4e5f60001/edit, or /sql/warehouses/create for a new warehouse).
  Synthetic data only. Most size options show an explicit DBU/h hint; 5X-Large does not, so it
  shows "Rate unavailable" unless the Azure serverless mapping applies (it never applies to

  the selected size. Nothing is clicked, saved or resized; native inputs keep their values.

<style data-fixture="warehouse-size">

  .fx-whf [role="option"] { padding: 4px 10px; display: flex; gap: 8px; align-items: center; }
  .fx-whf [role="option"][aria-selected="true"] { background: #e8f1fa; }

</style>
<section class="fx-whf" data-testid="warehouse-edit-page">

    <div class="fx-field">

      <button type="button" role="combobox" aria-haspopup="listbox" aria-expanded="true" aria-labelledby="fx-size-label" aria-controls="fx-size-list">Small</button>
