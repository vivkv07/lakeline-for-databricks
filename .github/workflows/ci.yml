name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the token can only read the repository. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No dependency runs install scripts; --ignore-scripts keeps it that way.
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Package the store build (file allowlist and secret scan)
        run: node scripts/package.mjs --store
