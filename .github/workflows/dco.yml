name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: dco
    # Dependabot's commits can't carry a human sign-off.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -Fxq -- "$author"; then
              # Only the SHA is printed: author text is untrusted input.
              echo "Commit $c has no Signed-off-by line matching its author."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Sign off each commit: git rebase --signoff main && git push --force-with-lease (see CONTRIBUTING.md)."
          fi
          exit "$fail"
